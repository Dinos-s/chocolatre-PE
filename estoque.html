<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Chocolatra</title>
</head>
<body>
    <header>
        <h1>Chocolatra</h1>
        <p class="subtitle">Controle de estoque de trufas artesanais</p>
        <a href="index.html" class="btn-voltar"><i class="fas fa-arrow-left"></i>Voltar</a>
    </header>

    <main class="estoque-container">
        <h2>Estoque</h2>
        <div class="estoque-lista">
            <div class="estoque-item">
                <span class="estoque-nome">Brigadeiro</span>
                <span class="estoque-quantidade">50</span>
            </div>
            <div class="estoque-item">
                <span class="estoque-nome">Beijinho</span>
                <span class="estoque-quantidade">30</span>
            </div>
            <div class="estoque-item">
                <span class="estoque-nome">Coco</span>
                <span class="estoque-quantidade">20</span>
            </div>
        </div>
    </main>
    
</body>
</html>
