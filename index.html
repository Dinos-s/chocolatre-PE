<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Chocolatra</title>
</head>
<body>
  <header>
    <h1>Chocolatra</h1>
    <p class="subtitle">Controle de estoque de trufas artesanais</p>
  </header>

  <section class="input-section">
    <div class="input-group">
      <label>Qual o sabor da trufa: </label>
      <input type="text" id="sabor" placeholder="Ex: Brigadeiro">
    </div>

    <div class="quantity-controls">
      <button class="quantity-btn" id="menos"><i class="fa-solid fa-minus"></i></button>
      <input type="number" value="0" id="quantidade">
      <button class="quantity-btn" id="mais"><i class="fa-solid fa-plus"></i></button>
    </div>

    <button class="add-button">Adicionar</button>  
  </section>

  <section class="truffle-list">
    <h2>Listagem das trufas</h2>
    
    <div class="truffle-item">
      <div class="truffle-info">
        <div class="truffle-name">Bem Casado</div>
        <div class="truffle-details">Adicionado em: 01/02/2025</div>
      </div>
      <div class="truffle-quantity">10</div>
    </div>

    <div class="truffle-item">
      <div class="truffle-info">
        <div class="truffle-name">Oreo</div>
        <div class="truffle-details">Adicionado em: 01/01/2023</div>
      </div>
      <div class="truffle-quantity">25</div>
    </div>

  </section>

  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/script.js"></script>
</body>
</html>
